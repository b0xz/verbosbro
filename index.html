<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tab-title">Dashboard - Canvas</title>
  <link id="tab-favicon" rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">

  <style>
    :root {
      --gui-scale: 1.15;
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #262626;
      --text: #ffffff;
      --subtext: #888888;
      --accent: #3b82f6;
      --hover: #1a1a1a;
      --font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .star-blend-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#bg-stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .home-view {
      position: absolute;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .home-view.hidden { display: none; }

    .star-text {
      color: var(--text);
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2.5px;
      text-transform: lowercase;
      user-select: none;
      text-align: center;
    }

    canvas#star-canvas {
      position: absolute;
      width: 380px;
      height: 380px;
      z-index: 4;
      mix-blend-mode: difference;
    }

    /* Left Sidebar Taskbar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(64px * var(--gui-scale));
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(18px * var(--gui-scale));
      padding-bottom: calc(18px * var(--gui-scale));
      gap: calc(14px * var(--gui-scale));
      z-index: 1200;
    }

    .sidebar-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      width: calc(42px * var(--gui-scale));
      height: calc(42px * var(--gui-scale));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }

    .sidebar-btn:hover, .sidebar-btn.active {
      background: var(--hover);
      border-color: var(--border);
      color: var(--accent);
    }

    .profile-avatar-btn {
      margin-top: auto;
      width: calc(40px * var(--gui-scale));
      height: calc(40px * var(--gui-scale));
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      cursor: pointer;
    }

    .profile-avatar-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .svg-icon {
      width: calc(20px * var(--gui-scale));
      height: calc(20px * var(--gui-scale));
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Top Tab Bar */
    .tab-bar-container {
      position: fixed;
      top: 0;
      left: calc(64px * var(--gui-scale));
      right: 0;
      height: calc(46px * var(--gui-scale));
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 calc(14px * var(--gui-scale));
      gap: calc(8px * var(--gui-scale));
      z-index: 1100;
      overflow-x: auto;
    }

    .tab-item {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: calc(8px * var(--gui-scale)) calc(14px * var(--gui-scale));
      border-radius: 10px 10px 0 0;
      font-size: calc(0.85rem * var(--gui-scale));
      cursor: grab;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 180px;
      white-space: nowrap;
      user-select: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .tab-item:active { cursor: grabbing; }

    .tab-item.active {
      background: var(--panel);
      color: var(--text);
      border-bottom-color: var(--panel);
    }

    .tab-close {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 1rem;
    }

    .tab-close:hover { color: var(--text); }

    .add-tab-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text);
      width: calc(32px * var(--gui-scale));
      height: calc(32px * var(--gui-scale));
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .add-tab-btn:hover { background: var(--hover); }

    .footer-credit {
      position: fixed;
      bottom: calc(85px * var(--gui-scale));
      left: 50%;
      transform: translateX(-50%);
      color: var(--subtext);
      font-size: 0.85rem;
      cursor: pointer;
      z-index: 1300;
      user-select: none;
    }

    /* Bottom Pill & Nav Controls */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: calc(20px * var(--gui-scale));
      left: calc(50% + 32px * var(--gui-scale));
      transform: translateX(-50%);
      width: 90%;
      max-width: calc(750px * var(--gui-scale));
      z-index: 1300;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: center;
    }

    .bottom-nav-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(35px * var(--gui-scale));
      padding: calc(6px * var(--gui-scale)) calc(12px * var(--gui-scale));
      display: flex;
      align-items: center;
      gap: calc(8px * var(--gui-scale));
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.8);
      width: 100%;
    }

    .bottom-nav-pill:focus-within { border-color: var(--accent); }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: calc(34px * var(--gui-scale));
      height: calc(34px * var(--gui-scale));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .nav-btn:hover { background: var(--hover); color: var(--accent); }

    .pill-btn-toggle {
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: calc(18px * var(--gui-scale));
      padding: calc(6px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(0.78rem * var(--gui-scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
      white-space: nowrap;
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: calc(8px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(1rem * var(--gui-scale));
      color: var(--text);
    }

    .pill-input::placeholder { color: var(--subtext); }

    .go-btn {
      background: var(--text);
      border: none;
      width: calc(34px * var(--gui-scale));
      height: calc(34px * var(--gui-scale));
      border-radius: 50%;
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .go-btn:hover { background: var(--accent); transform: scale(1.05); }

    .mode-menu-table, .device-menu-table {
      position: absolute;
      bottom: calc(60px * var(--gui-scale));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(14px * var(--gui-scale));
      padding: calc(10px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 1400;
    }

    .mode-menu-table.active, .device-menu-table.active { opacity: 1; pointer-events: all; transform: translateY(0); }

    .mode-row-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: calc(8px * var(--gui-scale)) calc(12px * var(--gui-scale));
      border-radius: calc(8px * var(--gui-scale));
      font-size: calc(0.85rem * var(--gui-scale));
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      white-space: nowrap;
    }

    .mode-row-btn:hover { background: var(--hover); border-color: var(--accent); }

    /* Proxy Viewports & Loading Spinner */
    .proxy-viewer {
      position: fixed;
      top: calc(46px * var(--gui-scale));
      left: calc(64px * var(--gui-scale));
      width: calc(100vw - 64px * var(--gui-scale));
      height: calc(100vh - 46px * var(--gui-scale));
      background: var(--bg);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: space-between;
      padding-bottom: calc(85px * var(--gui-scale));
      gap: 12px;
      padding-left: 12px;
      padding-right: 12px;
    }

    .proxy-viewer.active { display: flex; }

    .screen-panel {
      flex: 1;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .device-viewport { width: 100%; height: 100%; background: #ffffff; }
    .proxy-frame { width: 100%; height: 100%; border: none; background: #ffffff; }

    .loading-overlay {
      position: absolute;
      top: calc(46px * var(--gui-scale));
      left: calc(64px * var(--gui-scale));
      right: 0;
      bottom: calc(85px * var(--gui-scale));
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(2px);
      z-index: 1500;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .loading-overlay.hidden { display: none; }

    .spinner-ring {
      width: 50px;
      height: 50px;
      border: 4px solid var(--border);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Modal System */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(4px);
      z-index: 3000; display: flex; align-items: center; justify-content: center;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
      width: 90%; max-width: 440px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; font-weight: bold;
    }
    .setting-group { display: flex; flex-direction: column; gap: 8px; }
    .setting-group label { font-size: 0.82rem; color: var(--subtext); }
    .setting-input {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; color: var(--text); outline: none; width: 100%;
    }
    .setting-input:focus { border-color: var(--accent); }

    .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .theme-card {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px;
      transition: all 0.2s ease;
    }
    .theme-card:hover, .theme-card.active { border-color: var(--accent); background: var(--hover); }
    .theme-color-preview { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--border); }

    .action-btn {
      background: var(--text); border: none; border-radius: 8px; padding: 12px;
      font-weight: bold; color: var(--bg); cursor: pointer; transition: opacity 0.2s ease;
    }
    .action-btn:hover { opacity: 0.9; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="star-blend-container">
    <canvas id="bg-stars"></canvas>
    <div class="home-view" id="home-view">
      <div class="star-text">*welcome to verbos</div>
    </div>
    <canvas id="star-canvas" width="380" height="380"></canvas>
  </div>

  <div class="loading-overlay hidden" id="loading-spinner">
    <div class="spinner-ring"></div>
  </div>

  <!-- Sidebar Taskbar -->
  <div class="sidebar">
    <button class="sidebar-btn active" id="sb-home" title="Home">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </button>
    <button class="sidebar-btn" id="sb-bookmarks" title="Bookmarks & Notes">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
    </button>
    <button class="sidebar-btn" id="sb-settings" title="Theme & Settings">
      <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
    <div class="profile-avatar-btn" id="sb-profile" title="Sign In / Profile">
      <span id="pfp-initial" style="font-weight:bold; font-size:0.9rem;">?</span>
      <img id="pfp-img" src="" class="hidden" alt="Profile" />
    </div>
  </div>

  <!-- Top Tab Bar -->
  <div class="tab-bar-container" id="tab-bar">
    <button class="add-tab-btn" id="add-tab-btn" title="New Tab">+</button>
  </div>

  <div class="footer-credit" id="footer-credit">(based off of rammerhead)</div>

  <!-- Bottom Search Pill & Menus -->
  <div class="bottom-nav-wrapper">
    <div class="mode-menu-table" id="mode-menu">
      <button class="mode-row-btn" data-mode="fast"><span>Fast Mode</span></button>
      <button class="mode-row-btn" data-mode="strong"><span>Strong Mode</span></button>
    </div>

    <div class="device-menu-table" id="device-menu">
      <button class="mode-row-btn" data-device="desktop"><span>Desktop (Chrome)</span></button>
      <button class="mode-row-btn" data-device="tablet"><span>Tablet (iPad)</span></button>
      <button class="mode-row-btn" data-device="mobile"><span>Mobile (iPhone)</span></button>
      <button class="mode-row-btn" data-device="xbox"><span>Xbox Console Browser</span></button>
      <button class="mode-row-btn" data-device="playstation"><span>PlayStation Browser</span></button>
      <button class="mode-row-btn" data-device="smarttv"><span>Smart TV</span></button>
    </div>

    <div class="device-menu-table" id="vpn-menu" style="right: 120px;">
      <button class="mode-row-btn" data-vpn="direct"><span>Direct Proxy (Standard)</span></button>
      <button class="mode-row-btn" data-vpn="us-east"><span>US-East (Virginia)</span></button>
      <button class="mode-row-btn" data-vpn="eu-west"><span>EU-West (Frankfurt)</span></button>
      <button class="mode-row-btn" data-vpn="asia-sec"><span>Asia-Secure (Tokyo)</span></button>
    </div>

    <div class="bottom-nav-pill">
      <button class="nav-btn" id="btn-back"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="nav-btn" id="btn-forward"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      <button class="nav-btn" id="btn-reload"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path></svg></button>

      <button class="pill-btn-toggle" id="mode-toggle-btn"><span id="current-mode-label">Fast</span> ▾</button>
      <button class="pill-btn-toggle" id="device-toggle-btn"><span id="current-device-label">Desktop</span> ▾</button>
      <button class="pill-btn-toggle" id="vpn-toggle-btn"><span id="current-vpn-label">US-East</span> ▾</button>

      <input type="text" id="proxy-input" class="pill-input" placeholder="Enter URL..." autocomplete="off" autofocus />
      <button class="go-btn" id="proxy-go"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
    </div>
  </div>

  <!-- Bookmarks & Notes Modal -->
  <div class="modal-overlay hidden" id="bookmarks-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Bookmarks & Quick Notes</span>
        <button class="nav-btn" id="close-bookmarks">×</button>
      </div>
      <div class="setting-group">
        <label>Local Scratchpad</label>
        <textarea id="notes-textarea" class="setting-input" rows="5" placeholder="Type quick notes here..."></textarea>
      </div>
      <button class="action-btn" id="save-notes">Save Notes</button>
    </div>
  </div>

  <!-- Settings & Dark Color Presets Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Sleek Dark Color Themes</span>
        <button class="nav-btn" id="close-settings">×</button>
      </div>
      <div class="setting-group">
        <label>Select a Dark Palette (Non-flashy)</label>
        <div class="theme-grid">
          <div class="theme-card active" data-theme="obsidian">
            <div class="theme-color-preview" style="background:#3b82f6;"></div>
            <span style="font-size:0.8rem;">Obsidian</span>
          </div>
          <div class="theme-card" data-theme="cyber">
            <div class="theme-color-preview" style="background:#06b6d4;"></div>
            <span style="font-size:0.8rem;">Cyber</span>
          </div>
          <div class="theme-card" data-theme="emerald">
            <div class="theme-color-preview" style="background:#10b981;"></div>
            <span style="font-size:0.8rem;">Emerald</span>
          </div>
          <div class="theme-card" data-theme="amethyst">
            <div class="theme-color-preview" style="background:#8b5cf6;"></div>
            <span style="font-size:0.8rem;">Amethyst</span>
          </div>
          <div class="theme-card" data-theme="crimson">
            <div class="theme-color-preview" style="background:#ef4444;"></div>
            <span style="font-size:0.8rem;">Crimson</span>
          </div>
        </div>
      </div>
      <button class="action-btn" id="close-settings-btn">Apply & Close</button>
    </div>
  </div>

  <!-- Sign In / Custom Profile Modal -->
  <div class="modal-overlay hidden" id="profile-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Account & Profile</span>
        <button class="nav-btn" id="close-profile">×</button>
      </div>
      <div class="setting-group">
        <label>Display Name</label>
        <input type="text" id="profile-name" class="setting-input" placeholder="e.g. VerbosUser" />
      </div>
      <div class="setting-group">
        <label>Avatar Image URL (Custom PFP)</label>
        <input type="text" id="profile-pfp" class="setting-input" placeholder="https://example.com/avatar.png" />
      </div>
      <button class="action-btn" id="save-profile">Sign In / Save Profile</button>
    </div>
  </div>

  <!-- Proxy Viewports -->
  <div class="proxy-viewer" id="proxy-viewer">
    <div class="screen-panel" id="screen-panel-1">
      <!-- Added sandbox attributes to allow robust interaction & navigation syncing -->
      <div class="device-viewport"><iframe id="proxy-iframe-1" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock"></iframe></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
