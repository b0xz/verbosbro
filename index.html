<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, helvetica, arial, sans-serif;
      background-color: #0f0f11;
      color: #e4e4e7;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      background-color: #121214;
      border-top: 1px solid #27272a;
    }
    .url-input {
      flex: 1;
      background-color: #3f3f46;
      border: 1px solid #52525b;
      border-radius: 6px;
      padding: 10px 14px;
      color: #f4f4f5;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .url-input:focus {
      border-color: #71717a;
    }
    .selector {
      background-color: #27272a;
      border: 1px solid #3f3f46;
      border-radius: 6px;
      padding: 10px 12px;
      color: #a1a1aa;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .go-btn {
      background-color: #f4f4f5;
      color: #09090b;
      border: none;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .go-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe id="browserFrame" class="viewport" src="about:blank"></iframe>
    <div class="nav-bar">
      <select id="modeSelector" class="selector">
        <option value="desktop">profile: desktop chrome</option>
        <option value="mobile">profile: mobile iphone</option>
        <option value="stealth">profile: stealth mode</option>
      </select>
      <input type="text" id="addressBar" class="url-input" placeholder="type a url or search query..." autofocus>
      <button onclick="navigate()" class="go-btn">go</button>
    </div>
  </div>

  <script>
    const addressBar = document.getElementById('addressBar');
    const browserFrame = document.getElementById('browserFrame');
    const modeSelector = document.getElementById('modeSelector');

    addressBar.addEventListener('keypress', function(e) {
      if (e.key === 'enter') {
        navigate();
      }
    });

    function navigate() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const selectedMode = modeSelector.value;
      browserFrame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${selectedMode}`;
    }
  </script>

</body>
</html>
