<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser os</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, helvetica, arial, sans-serif;
      background-color: #030305;
      color: #e4e4e7;
    }

    .fluid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: linear-gradient(125deg, #030305, #121218, #0a0a0f, #1a1a24);
      background-size: 400% 400%;
      animation: glslFluid 10s ease infinite;
    }
    @keyframes glslFluid {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .desktop-space {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      overflow: hidden;
    }

    .browser-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(18, 18, 22, 0.95);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: width 0.3s ease, height 0.3s ease, border-radius 0.3s ease;
    }

    .browser-window.floating {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      resize: both;
      min-width: 400px;
      min-height: 300px;
    }

    .window-header {
      height: 32px;
      background: rgba(25, 25, 32, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: grab;
      user-select: none;
    }
    .window-header:active {
      cursor: grabbing;
    }
    .window-title {
      font-size: 11px;
      color: #a1a1aa;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      margin-left: 8px;
    }
    .window-controls {
      display: flex;
      gap: 6px;
    }
    .win-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      cursor: pointer;
    }
    .dot-close { background: #ff5f56; }

    .window-content {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    .dock-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      z-index: 10;
      background: linear-gradient(135deg, rgba(30, 30, 38, 0.7), rgba(15, 15, 20, 0.9));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .selector, .icon-btn {
      background: transparent;
      border: none;
      padding: 6px 8px;
      color: #d4d4d8;
      font-size: 12px;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .url-input {
      width: 300px;
      max-width: 35vw;
      background: transparent;
      border: none;
      padding: 6px 12px;
      color: #f4f4f5;
      font-size: 13px;
      outline: none;
    }
    .go-btn {
      background: #f4f4f5;
      color: #09090b;
      border: none;
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .tabs-bar {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .tab-circle {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(30, 30, 38, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #a1a1aa;
      font-size: 12px;
      transition: all 0.2s ease;
    }
    .tab-circle.active {
      border-color: #fff;
      color: #fff;
      background: rgba(60, 60, 75, 0.9);
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }
    .tab-circle:hover {
      transform: scale(1.05);
    }

    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal h3 { margin-bottom: 12px; font-size: 16px; color: #fff; }
    .modal label { display: block; font-size: 12px; color: #a1a1aa; margin-top: 10px; }
    .modal select, .modal input[type="range"] { width: 100%; margin-top: 4px; padding: 6px; background: #2a2a35; border: 1px solid #3f3f46; color: #fff; border-radius: 6px; }
    .close-modal { margin-top: 16px; width: 100%; padding: 8px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="fluid-bg"></div>

  <div class="tabs-bar" id="tabsBar">
    <div class="tab-circle active" onclick="switchTab(1)" id="tab-1">1</div>
    <div class="tab-circle" onclick="addNewTab()" title="new tab">+</div>
  </div>

  <div class="desktop-space" id="desktopSpace">
    <div class="browser-window" id="window-1">
      <div class="window-header" ondblclick="splitToFloating('window-1')">
        <div class="window-title" id="title-1">about:blank</div>
      </div>
      <iframe class="window-content" id="frame-1" src="about:blank"></iframe>
    </div>
  </div>

  <div class="dock-container" id="dockContainer">
    <select id="modeSelector" class="selector">
      <option value="desktop">desktop</option>
      <option value="mobile">mobile</option>
      <option value="stealth">incognito</option>
    </select>
    <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);"></div>
    <select id="speedSelector" class="selector">
      <option value="fast">fast</option>
      <option value="strong">strong</option>
    </select>
    <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);"></div>
    <button onclick="toggleStar()" class="icon-btn" id="starBtn" title="favorite">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
    </button>
    <input type="text" id="addressBar" class="url-input" placeholder="type url or search..." autofocus>
    <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);"></div>
    <button onclick="navigateActiveWindow()" class="go-btn">go</button>
    <button onclick="toggleSettings()" class="icon-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </div>

  <div class="modal" id="settingsModal">
    <h3>settings</h3>
    <label>privacy level</label>
    <select id="settingPrivacy"><option value="strict">strict tracker block</option></select>
    <label>ui scale</label>
    <input type="range" min="80" max="120" value="100" oninput="document.getElementById('dockContainer').style.transform=`translateX(-50%) scale(${this.value/100})`">
    <button class="close-modal" onclick="toggleSettings()">close</button>
  </div>

  <script>
    let activeTabId = 1;
    let tabCount = 1;

    const addressBar = document.getElementById('addressBar');
    const modeSelector = document.getElementById('modeSelector');
    const speedSelector = document.getElementById('speedSelector');

    addressBar.addEventListener('keypress', e => { if (e.key === 'Enter') navigateActiveWindow(); });

    function navigateActiveWindow() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const mode = modeSelector.value;
      const speed = speedSelector.value;
      const frame = document.getElementById(`frame-${activeTabId}`);
      const title = document.getElementById(`title-${activeTabId}`);

      if (frame) {
        frame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${mode}&speed=${speed}`;
        title.innerText = input;
      }
    }

    function addNewTab() {
      tabCount++;
      const id = tabCount;
      
      document.querySelectorAll('.browser-window').forEach(w => w.style.display = 'none');
      document.querySelectorAll('.tab-circle').forEach(t => t.classList.remove('active'));

      const desktop = document.getElementById('desktopSpace');
      const win = document.createElement('div');
      win.className = 'browser-window';
      win.id = `window-${id}`;
      win.innerHTML = `
        <div class="window-header" ondblclick="splitToFloating('window-${id}')">
          <div class="window-title" id="title-${id}">about:blank</div>
        </div>
        <iframe class="window-content" id="frame-${id}" src="about:blank"></iframe>
      `;
      desktop.appendChild(win);

      const tabsBar = document.getElementById('tabsBar');
      const tab = document.createElement('div');
      tab.className = 'tab-circle active';
      tab.id = `tab-${id}`;
      tab.innerText = id;
      tab.onclick = () => switchTab(id);
      tabsBar.insertBefore(tab, tabsBar.lastElementChild);

      activeTabId = id;
      addressBar.value = '';
    }

    function switchTab(id) {
      document.querySelectorAll('.browser-window').forEach(w => w.style.display = 'none');
      document.querySelectorAll('.tab-circle').forEach(t => t.classList.remove('active'));

      const targetWin = document.getElementById(`window-${id}`);
      if (targetWin) targetWin.style.display = 'flex';
      const targetTab = document.getElementById(`tab-${id}`);
      if (targetTab) targetTab.classList.add('active');

      activeTabId = id;
    }

    function splitToFloating(windowId) {
      const win = document.getElementById(windowId);
      if (!win.classList.contains('floating')) {
        win.classList.add('floating');
        win.style.top = '50px';
        win.style.left = '50px';
        win.style.width = '700px';
        win.style.height = '450px';

        const header = win.querySelector('.window-header');
        if (!header.querySelector('.win-dot')) {
          const controls = document.createElement('div');
          controls.className = 'window-controls';
          controls.innerHTML = `<div class="win-dot dot-close" onclick="closeFloatingWindow('${windowId}')"></div>`;
          header.insertBefore(controls, header.firstChild);
        }

        enableDragging(win, header);
      }
    }

    function enableDragging(win, header) {
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      header.onmousedown = function(e) {
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = win.offsetLeft;
        initialTop = win.offsetTop;
        e.preventDefault();
      };

      document.onmousemove = function(e) {
        if (!isDragging) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        win.style.left = (initialLeft + dx) + 'px';
        win.style.top = (initialTop + dy) + 'px';
      };

      document.onmouseup = function() {
        isDragging = false;
      };
      
      document.onmouseleave = function() {
        isDragging = false;
      };
    }

    function closeFloatingWindow(windowId) {
      const win = document.getElementById(windowId);
      if (win) win.remove();
    }

    function toggleStar() {
      const btn = document.getElementById('starBtn');
      btn.style.color = btn.style.color === 'rgb(250, 204, 21)' ? '#d4d4d8' : '#facc15';
    }

    function toggleSettings() {
      const modal = document.getElementById('settingsModal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }
  </script>
</body>
</html>
