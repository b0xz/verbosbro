<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, helvetica, arial, sans-serif;
      background-color: #050507;
      color: #e4e4e7;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }
    .nav-bar {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: transparent;
      z-index: 10;
    }
    @keyframes fluidShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .fluid-pill {
      background: linear-gradient(270deg, #27272a, #3f3f46, #52525b, #27272a);
      background-size: 300% 300%;
      animation: fluidShift 8s ease infinite;
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }
    .selector {
      background: transparent;
      border: none;
      padding: 8px 12px;
      color: #d4d4d8;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .url-input {
      width: 400px;
      max-width: 60vw;
      background: transparent;
      border: none;
      padding: 8px 14px;
      color: #f4f4f5;
      font-size: 13px;
      outline: none;
    }
    .url-input::placeholder {
      color: #a1a1aa;
    }
    .go-btn {
      background: transparent;
      color: #f4f4f5;
      border: none;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .go-btn:hover {
      opacity: 0.7;
    }
    .divider {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe id="browserFrame" class="viewport" src="about:blank"></iframe>
    <div class="nav-bar">
      <div class="fluid-pill" style="display: flex; align-items: center;">
        <select id="modeSelector" class="selector">
          <option value="desktop">desktop</option>
          <option value="mobile">mobile</option>
          <option value="stealth">incognito</option>
        </select>
        <div class="divider"></div>
        <input type="text" id="addressBar" class="url-input" placeholder="type url or search..." autofocus>
        <div class="divider"></div>
        <button onclick="navigate()" class="go-btn">go</button>
      </div>
    </div>
  </div>

  <script>
    const addressBar = document.getElementById('addressBar');
    const browserFrame = document.getElementById('browserFrame');
    const modeSelector = document.getElementById('modeSelector');

    addressBar.addEventListener('keypress', function(e) {
      if (e.key === 'enter') {
        navigate();
      }
    });

    function navigate() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const selectedMode = modeSelector.value;
      
      if (selectedMode === 'stealth') {
        browserFrame.contentWindow.location.replace('about:blank');
      }

      browserFrame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${selectedMode}`;
    }
  </script>

</body>
</html>
