<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab-title">Dashboard - Canvas</title>
  <link id="tab-favicon" rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">

  <style>
    :root {
      --gui-scale: 1;
      --bg: #121212;
      --panel: #1e1e1e;
      --border: #2e2e2e;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --accent: #e0e0e0;
      --hover: #2a2a2a;
      --font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .app-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(20px * var(--gui-scale));
    }

    .top-bar {
      position: absolute;
      top: calc(16px * var(--gui-scale));
      right: calc(16px * var(--gui-scale));
      display: flex;
      gap: 10px;
      z-index: 10;
    }

    .icon-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      width: calc(36px * var(--gui-scale));
      height: calc(36px * var(--gui-scale));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--hover);
      border-color: var(--accent);
    }

    .svg-icon {
      width: calc(16px * var(--gui-scale));
      height: calc(16px * var(--gui-scale));
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: calc(16px * var(--gui-scale));
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: calc(680px * var(--gui-scale));
      z-index: 1001;
    }

    .bottom-nav-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(30px * var(--gui-scale));
      padding: calc(4px * var(--gui-scale)) calc(8px * var(--gui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .bottom-nav-pill:focus-within {
      border-color: var(--accent);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: calc(30px * var(--gui-scale));
      height: calc(30px * var(--gui-scale));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: var(--hover);
      color: var(--accent);
    }

    .pill-btn-toggle {
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: calc(15px * var(--gui-scale));
      padding: calc(4px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(0.8rem * var(--gui-scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .pill-btn-toggle:hover {
      border-color: var(--accent);
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: calc(6px * var(--gui-scale)) calc(8px * var(--gui-scale));
      font-size: calc(0.95rem * var(--gui-scale));
      color: var(--text);
    }

    .pill-input::placeholder {
      color: var(--subtext);
    }

    .go-btn {
      background: var(--text);
      border: none;
      width: calc(30px * var(--gui-scale));
      height: calc(30px * var(--gui-scale));
      border-radius: 50%;
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .go-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    .mode-menu-table {
      position: absolute;
      bottom: calc(50px * var(--gui-scale));
      left: calc(100px * var(--gui-scale));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(12px * var(--gui-scale));
      padding: calc(8px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 1002;
    }

    .mode-menu-table.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .mode-row-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: calc(8px * var(--gui-scale)) calc(12px * var(--gui-scale));
      border-radius: calc(8px * var(--gui-scale));
      font-size: calc(0.85rem * var(--gui-scale));
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .mode-row-btn:hover, .mode-row-btn.selected {
      background: var(--hover);
      border-color: var(--accent);
    }

    .mode-row-btn small {
      color: var(--subtext);
    }

    .device-menu-table {
      position: absolute;
      bottom: calc(50px * var(--gui-scale));
      left: calc(180px * var(--gui-scale));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(12px * var(--gui-scale));
      padding: calc(8px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 1002;
    }

    .device-menu-table.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .proxy-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding-bottom: calc(65px * var(--gui-scale));
    }

    .proxy-viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .device-viewport {
      width: 100%;
      height: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      border: none;
      background: #ffffff;
    }

    .device-viewport.mode-mobile {
      width: 375px;
      height: 667px;
      border: 12px solid #2a2a2a;
      border-radius: 36px;
    }

    .device-viewport.mode-tablet {
      width: 768px;
      height: 1024px;
      border: 14px solid #2a2a2a;
      border-radius: 24px;
    }

    .proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      border-radius: inherit;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(14px * var(--gui-scale));
      width: 90%;
      max-width: calc(420px * var(--gui-scale));
      padding: calc(20px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(16px * var(--gui-scale));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: calc(1rem * var(--gui-scale));
      font-weight: bold;
    }

    .setting-table {
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--gui-scale));
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--gui-scale));
    }

    .setting-row label {
      font-size: calc(0.85rem * var(--gui-scale));
      color: var(--subtext);
      display: flex;
      justify-content: space-between;
    }

    .setting-select, .setting-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: calc(6px * var(--gui-scale));
      padding: calc(8px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(0.85rem * var(--gui-scale));
      color: var(--text);
      outline: none;
    }

    .slider-container input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .save-btn {
      background: var(--text);
      border: none;
      border-radius: calc(6px * var(--gui-scale));
      padding: calc(10px * var(--gui-scale));
      font-size: calc(0.9rem * var(--gui-scale));
      font-weight: bold;
      color: var(--bg);
      cursor: pointer;
    }

    .chat-drawer {
      position: fixed;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100vh;
      background: var(--panel);
      border-left: 1px solid var(--border);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }

    .chat-drawer.active {
      right: 0;
    }

    .chat-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .chat-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .chat-msg strong {
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
      font-size: 0.75rem;
    }

    .chat-footer {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <button class="icon-btn" id="chat-toggle-btn" title="Live Chat">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>

      <button class="icon-btn" id="settings-btn" title="Settings">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="bottom-nav-wrapper">
    <div class="mode-menu-table" id="mode-menu">
      <button class="mode-row-btn" data-mode="fast">
        <span>Fast Mode</span>
        <small>Quick Relay</small>
      </button>
      <button class="mode-row-btn" data-mode="stealth">
        <span>Stealth Mode</span>
        <small>HTML Rewriter</small>
      </button>
      <button class="mode-row-btn" data-mode="strong">
        <span>Strong Mode</span>
        <small>Full SPA Interceptor</small>
      </button>
    </div>

    <div class="device-menu-table" id="device-menu">
      <button class="mode-row-btn" data-device="desktop">
        <span>Desktop View</span>
      </button>
      <button class="mode-row-btn" data-device="tablet">
        <span>Tablet View</span>
      </button>
      <button class="mode-row-btn" data-device="mobile">
        <span>Mobile View</span>
      </button>
    </div>

    <div class="bottom-nav-pill">
      <button class="nav-btn" id="btn-back" title="Go Back">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>

      <button class="nav-btn" id="btn-forward" title="Go Forward">
        <svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>

      <button class="nav-btn" id="btn-reload" title="Refresh">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <button class="pill-btn-toggle" id="mode-toggle-btn">
        <span id="current-mode-label">Strong</span> ▾
      </button>

      <button class="pill-btn-toggle" id="device-toggle-btn">
        <span id="current-device-label">Desktop</span> ▾
      </button>

      <input type="text" id="proxy-input" class="pill-input" placeholder="Enter URL..." autocomplete="off" autofocus />

      <button class="go-btn" id="proxy-go" title="Go">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <button class="nav-btn hidden" id="btn-close-viewer" title="Close Viewer">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Settings</span>
        <button class="nav-btn" id="modal-close">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="setting-table">
        <div class="setting-row">
          <label for="gui-scale-slider">GUI Scale: <span id="gui-scale-val">1.0x</span></label>
          <div class="slider-container">
            <input type="range" id="gui-scale-slider" min="0.8" max="1.5" step="0.05" value="1">
          </div>
        </div>

        <div class="setting-row">
          <label for="preset-select">Educational Tab Disguise</label>
          <select id="preset-select" class="setting-select">
            <option value="canvas">Canvas LMS</option>
            <option value="none">default</option>
            <option value="classroom">Google Classroom</option>
            <option value="drive">Google Drive</option>
            <option value="docs">Google Docs</option>
            <option value="edpuzzle">Edpuzzle</option>
            <option value="quizlet">Quizlet</option>
            <option value="clever">Clever</option>
            <option value="schoology">Schoology</option>
            <option value="khan">Khan Academy</option>
            <option value="desmos">Desmos Graphing Calculator</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="custom-title-input">Custom Title</label>
          <input type="text" id="custom-title-input" class="setting-input" placeholder="e.g., Chemistry Homework" />
        </div>

        <div class="setting-row">
          <label for="custom-icon-input">Custom Favicon URL</label>
          <input type="text" id="custom-icon-input" class="setting-input" placeholder="https://example.com/favicon.ico" />
        </div>
      </div>

      <button class="save-btn" id="save-settings">Save Configurations</button>
    </div>
  </div>

  <div class="chat-drawer" id="chat-drawer">
    <div class="chat-header">
      <span>miksi Chat</span>
      <button class="nav-btn" id="chat-close">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <div id="chat-auth-view" class="chat-body" style="justify-content: center;">
      <div class="setting-row">
        <label>Display Name</label>
        <input type="text" id="username-input" class="setting-input" placeholder="Enter handle..." />
      </div>
      <button class="save-btn" id="sign-in-btn">Sign In to Chat</button>
    </div>

    <div id="chat-messages-view" class="chat-body hidden">
      <div id="chat-msg-list"></div>
    </div>

    <div id="chat-footer-view" class="chat-footer hidden">
      <input type="text" id="chat-input" class="setting-input" style="flex:1;" placeholder="Message..." />
      <button class="save-btn" id="chat-send-btn">Send</button>
    </div>
  </div>

  <div class="proxy-viewer" id="proxy-viewer">
    <div id="device-wrapper" class="device-viewport">
      <iframe id="proxy-iframe" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
