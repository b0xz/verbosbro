<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab-title">Dashboard - Canvas</title>
  <link id="tab-favicon" rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --border: #2e2e2e;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --accent: #e0e0e0;
      --hover: #2a2a2a;
      --font: 'VT323', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      letter-spacing: 0.5px;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    .app-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .top-bar {
      position: absolute;
      top: 24px;
      right: 24px;
      z-index: 10;
    }

    .icon-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--hover);
      border-color: var(--accent);
    }

    .svg-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .svg-icon.hidden {
      display: none;
    }

    /* Floating Bottom Search Bar Pill (Enlarged) */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 820px;
      z-index: 1001;
    }

    .bottom-nav-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 50px;
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
    }

    .bottom-nav-pill:focus-within {
      border-color: var(--accent);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: var(--hover);
      color: var(--accent);
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 10px 14px;
      font-size: 1.6rem;
      color: var(--text);
    }

    .pill-input::placeholder {
      color: var(--subtext);
      font-size: 1.4rem;
    }

    .go-btn {
      background: var(--text);
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .go-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 90%;
      max-width: 480px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.5rem;
    }

    .setting-table {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-row label {
      font-size: 1.2rem;
      color: var(--subtext);
    }

    .setting-select, .setting-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1.2rem;
      color: var(--text);
      outline: none;
    }

    .setting-select:focus, .setting-input:focus {
      border-color: var(--accent);
    }

    .save-btn {
      background: var(--text);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--bg);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .save-btn:hover {
      background: var(--accent);
    }

    /* Proxy Fullscreen Overlay */
    .proxy-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      z-index: 999;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding-bottom: 110px;
    }

    .proxy-viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .proxy-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="top-bar">
      <button class="icon-btn" id="settings-btn" title="Settings">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="bottom-nav-wrapper">
    <div class="bottom-nav-pill">
      <button class="nav-btn" id="btn-back" title="Go Back">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button class="nav-btn" id="btn-forward" title="Go Forward">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <button class="nav-btn" id="btn-reload" title="Refresh">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <input 
        type="text" 
        id="proxy-input" 
        class="pill-input" 
        placeholder="Enter URL or search term..." 
        autocomplete="off"
        autofocus
      />

      <button class="go-btn" id="proxy-go" title="Go">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <button class="nav-btn hidden" id="btn-close-viewer" title="Close Viewer">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Settings</span>
        <button class="nav-btn" id="modal-close">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="setting-table">
        <div class="setting-row">
          <label for="preset-select">Educational Tab Disguise</label>
          <select id="preset-select" class="setting-select">
            <option value="canvas">Canvas LMS</option>
            <option value="none">default</option>
            <option value="classroom">Google Classroom</option>
            <option value="drive">Google Drive</option>
            <option value="docs">Google Docs</option>
            <option value="edpuzzle">Edpuzzle</option>
            <option value="quizlet">Quizlet</option>
            <option value="clever">Clever</option>
            <option value="schoology">Schoology</option>
            <option value="khan">Khan Academy</option>
            <option value="desmos">Desmos Graphing Calculator</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="custom-title-input">Custom Title</label>
          <input type="text" id="custom-title-input" class="setting-input" placeholder="e.g., Chemistry Homework" />
        </div>

        <div class="setting-row">
          <label for="custom-icon-input">Custom Favicon URL</label>
          <input type="text" id="custom-icon-input" class="setting-input" placeholder="https://example.com/favicon.ico" />
        </div>
      </div>

      <button class="save-btn" id="save-settings">Save Configurations</button>
    </div>
  </div>

  <div class="proxy-viewer" id="proxy-viewer">
    <iframe id="proxy-iframe" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </div>

  <script src="script.js"></script>
</body>
</html>
