<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "Segoe UI", roboto, oxygen, ubuntu, cantarell, sans-serif;
      background-color: #000000;
      color: #ededed;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      position: relative;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #000000;
    }
    .nav-bar {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px;
      z-index: 10;
    }

    @keyframes thickFluid {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .vercel-pill {
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #111111, #1c1c1c, #0a0a0a);
      background-size: 200% 200%;
      animation: thickFluid 10s ease infinite;
      border: 1px solid #333333;
      border-radius: 9999px;
      padding: 4px 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }
    .selector {
      background: transparent;
      border: none;
      padding: 6px 10px;
      color: #888888;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }
    .selector option {
      background: #111;
      color: #fff;
    }
    .url-input {
      width: 380px;
      max-width: 55vw;
      background: transparent;
      border: none;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    .url-input::placeholder {
      color: #666666;
    }
    .go-btn {
      background: #ffffff;
      color: #000000;
      border: none;
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease, opacity 0.2s ease;
    }
    .go-btn:hover {
      opacity: 0.9;
    }
    .divider {
      width: 1px;
      height: 14px;
      background: #333333;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe id="browserFrame" class="viewport" src="about:blank"></iframe>
    <div class="nav-bar">
      <div class="vercel-pill">
        <select id="modeSelector" class="selector">
          <option value="desktop">desktop</option>
          <option value="mobile">mobile</option>
          <option value="stealth">incognito</option>
        </select>
        <div class="divider"></div>
        <input type="text" id="addressBar" class="url-input" placeholder="type url or search..." autofocus>
        <div class="divider"></div>
        <button onclick="navigate()" class="go-btn">go</button>
      </div>
    </div>
  </div>

  <script>
    const addressBar = document.getElementById('addressBar');
    const browserFrame = document.getElementById('browserFrame');
    const modeSelector = document.getElementById('modeSelector');

    addressBar.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        navigate();
      }
    });

    function navigate() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const selectedMode = modeSelector.value;
      
      if (selectedMode === 'stealth') {
        browserFrame.contentWindow.location.replace('about:blank');
      }

      browserFrame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${selectedMode}`;
    }
  </script>

</body>
</html>
