<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab-title">Dashboard - Canvas</title>
  <link id="tab-favicon" rel="icon" type="image/x-icon" href="https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico">

  <style>
    :root {
      --gui-scale: 1;
      --bg: #121212;
      --panel: #1e1e1e;
      --border: #2e2e2e;
      --text: #ffffff;
      --subtext: #a0a0a0;
      --accent: #e0e0e0;
      --hover: #2a2a2a;
      --font: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    /* Left Sidebar Taskbar */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      width: calc(60px * var(--gui-scale));
      height: 100vh;
      background: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: calc(16px * var(--gui-scale));
      gap: calc(12px * var(--gui-scale));
      z-index: 1200;
      transition: transform 0.2s ease;
    }

    .sidebar-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      width: calc(40px * var(--gui-scale));
      height: calc(40px * var(--gui-scale));
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar-btn:hover, .sidebar-btn.active {
      background: var(--hover);
      border-color: var(--border);
      color: var(--accent);
    }

    .svg-icon {
      width: calc(18px * var(--gui-scale));
      height: calc(18px * var(--gui-scale));
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Top Tab Bar */
    .tab-bar-container {
      position: fixed;
      top: 0;
      left: calc(60px * var(--gui-scale));
      right: 0;
      height: calc(40px * var(--gui-scale));
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 calc(12px * var(--gui-scale));
      gap: calc(8px * var(--gui-scale));
      z-index: 1100;
      overflow-x: auto;
    }

    .tab-item {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--subtext);
      padding: calc(6px * var(--gui-scale)) calc(12px * var(--gui-scale));
      border-radius: 8px 8px 0 0;
      font-size: calc(0.8rem * var(--gui-scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 160px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-item.active {
      background: var(--panel);
      color: var(--text);
      border-bottom-color: var(--panel);
    }

    .tab-close {
      background: transparent;
      border: none;
      color: var(--subtext);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .tab-close:hover {
      color: #ff5555;
    }

    .add-tab-btn {
      background: transparent;
      border: 1px dashed var(--border);
      color: var(--text);
      width: calc(28px * var(--gui-scale));
      height: calc(28px * var(--gui-scale));
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .add-tab-btn:hover {
      background: var(--hover);
    }

    .app-container {
      position: relative;
      margin-left: calc(60px * var(--gui-scale));
      margin-top: calc(40px * var(--gui-scale));
      display: flex;
      align-items: center;
      justify-content: center;
      height: calc(100vh - 40px * var(--gui-scale));
      padding: calc(20px * var(--gui-scale));
    }

    /* Bottom Navigation Pill */
    .bottom-nav-wrapper {
      position: fixed;
      bottom: calc(16px * var(--gui-scale));
      left: calc(50% + 30px * var(--gui-scale));
      transform: translateX(-50%);
      width: 85%;
      max-width: calc(640px * var(--gui-scale));
      z-index: 1300;
    }

    .bottom-nav-pill {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(30px * var(--gui-scale));
      padding: calc(4px * var(--gui-scale)) calc(8px * var(--gui-scale));
      display: flex;
      align-items: center;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    }

    .bottom-nav-pill:focus-within {
      border-color: var(--accent);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: calc(30px * var(--gui-scale));
      height: calc(30px * var(--gui-scale));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: var(--hover);
      color: var(--accent);
    }

    .pill-btn-toggle {
      background: var(--hover);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: calc(15px * var(--gui-scale));
      padding: calc(4px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(0.8rem * var(--gui-scale));
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: calc(6px * var(--gui-scale)) calc(8px * var(--gui-scale));
      font-size: calc(0.95rem * var(--gui-scale));
      color: var(--text);
    }

    .pill-input::placeholder {
      color: var(--subtext);
    }

    .go-btn {
      background: var(--text);
      border: none;
      width: calc(30px * var(--gui-scale));
      height: calc(30px * var(--gui-scale));
      border-radius: 50%;
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .go-btn:hover {
      background: var(--accent);
      transform: scale(1.05);
    }

    /* Mode & Device Menus */
    .mode-menu-table, .device-menu-table {
      position: absolute;
      bottom: calc(50px * var(--gui-scale));
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(12px * var(--gui-scale));
      padding: calc(8px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(6px * var(--gui-scale));
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.2s ease;
      z-index: 1400;
    }

    .mode-menu-table.active, .device-menu-table.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .mode-row-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: calc(8px * var(--gui-scale)) calc(12px * var(--gui-scale));
      border-radius: calc(8px * var(--gui-scale));
      font-size: calc(0.85rem * var(--gui-scale));
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .mode-row-btn:hover {
      background: var(--hover);
      border-color: var(--accent);
    }

    /* Proxy Viewer & Device Viewports */
    .proxy-viewer {
      position: fixed;
      top: calc(40px * var(--gui-scale));
      left: calc(60px * var(--gui-scale));
      width: calc(100vw - 60px * var(--gui-scale));
      height: calc(100vh - 40px * var(--gui-scale));
      background: var(--bg);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding-bottom: calc(65px * var(--gui-scale));
    }

    .proxy-viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .device-viewport {
      width: 100%;
      height: 100%;
      transition: all 0.3s ease;
      background: #ffffff;
      border: none;
    }

    .device-viewport.mode-mobile {
      width: 375px;
      height: 667px;
      border: 12px solid #2a2a2a;
      border-radius: 36px;
    }

    .device-viewport.mode-tablet {
      width: 768px;
      height: 1024px;
      border: 14px solid #2a2a2a;
      border-radius: 24px;
    }

    .proxy-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      border-radius: inherit;
    }

    /* Ruffle / Games Modal */
    .games-modal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80%;
      max-width: 700px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      z-index: 2500;
      display: none;
      flex-direction: column;
      gap: 16px;
    }

    .games-modal.active { display: flex; }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-height: 400px;
      overflow-y: auto;
    }

    .game-card {
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      cursor: pointer;
      transition: border 0.2s ease;
    }

    .game-card:hover { border-color: var(--accent); }

    /* Settings Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active { opacity: 1; pointer-events: all; }

    .modal-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: calc(14px * var(--gui-scale));
      width: 90%;
      max-width: calc(420px * var(--gui-scale));
      padding: calc(20px * var(--gui-scale));
      display: flex;
      flex-direction: column;
      gap: calc(16px * var(--gui-scale));
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .setting-table {
      display: flex;
      flex-direction: column;
      gap: calc(12px * var(--gui-scale));
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: calc(4px * var(--gui-scale));
    }

    .setting-row label {
      font-size: calc(0.85rem * var(--gui-scale));
      color: var(--subtext);
    }

    .setting-select, .setting-input {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: calc(6px * var(--gui-scale));
      padding: calc(8px * var(--gui-scale)) calc(10px * var(--gui-scale));
      font-size: calc(0.85rem * var(--gui-scale));
      color: var(--text);
      outline: none;
    }

    .save-btn {
      background: var(--text);
      border: none;
      border-radius: calc(6px * var(--gui-scale));
      padding: calc(10px * var(--gui-scale));
      font-size: calc(0.9rem * var(--gui-scale));
      font-weight: bold;
      color: var(--bg);
      cursor: pointer;
    }

    /* Chat Drawer */
    .chat-drawer {
      position: fixed;
      top: 0;
      right: -340px;
      width: 320px;
      height: 100vh;
      background: var(--panel);
      border-left: 1px solid var(--border);
      z-index: 2100;
      display: flex;
      flex-direction: column;
      transition: right 0.3s ease;
    }

    .chat-drawer.active { right: 0; }

    .chat-header {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
    }

    .chat-body {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .chat-msg {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85rem;
    }

    .chat-msg strong {
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
      font-size: 0.75rem;
    }

    .chat-footer {
      padding: 10px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 6px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Left Sidebar Taskbar -->
  <div class="sidebar" id="sidebar">
    <button class="sidebar-btn active" id="sb-home" title="Home / Search">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
    </button>
    <button class="sidebar-btn" id="sb-games" title="Ruffle Games">
      <svg class="svg-icon" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 12h4m-2-2v4"></path><line x1="15" y1="11" x2="15" y2="11.01"></line><line x1="18" y1="13" x2="18" y2="13.01"></line></svg>
    </button>
    <button class="sidebar-btn" id="sb-chat" title="Live Chat">
      <svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </button>
    <button class="sidebar-btn" id="sb-settings" title="Settings">
      <svg class="svg-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>
  </div>

  <!-- Top Tab Bar -->
  <div class="tab-bar-container" id="tab-bar">
    <div class="tab-item active" data-tab-id="1">
      <span class="tab-title-text">New Tab</span>
      <button class="tab-close">×</button>
    </div>
    <button class="add-tab-btn" id="add-tab-btn" title="New Tab">+</button>
  </div>

  <div class="app-container">
    <h1 style="color:var(--subtext); font-weight:normal; font-size:1.5rem;">miksi proxy browser</h1>
  </div>

  <!-- Bottom Search Bar Pill -->
  <div class="bottom-nav-wrapper">
    <div class="mode-menu-table" id="mode-menu">
      <button class="mode-row-btn" data-mode="fast"><span>Fast Mode</span><small>Direct Relay</small></button>
      <button class="mode-row-btn" data-mode="strong"><span>x20 Strong Mode</span><small>Deep SPA Interceptor</small></button>
    </div>

    <div class="device-menu-table" id="device-menu">
      <button class="mode-row-btn" data-device="desktop"><span>Desktop View</span></button>
      <button class="mode-row-btn" data-device="tablet"><span>Tablet View</span></button>
      <button class="mode-row-btn" data-device="mobile"><span>Mobile View</span></button>
    </div>

    <div class="bottom-nav-pill">
      <button class="nav-btn" id="btn-back" title="Go Back"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
      <button class="nav-btn" id="btn-forward" title="Go Forward"><svg class="svg-icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
      <button class="nav-btn" id="btn-reload" title="Refresh"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg></button>

      <button class="pill-btn-toggle" id="mode-toggle-btn"><span id="current-mode-label">x20 Strong</span> ▾</button>
      <button class="pill-btn-toggle" id="device-toggle-btn"><span id="current-device-label">Desktop</span> ▾</button>

      <input type="text" id="proxy-input" class="pill-input" placeholder="Enter URL..." autocomplete="off" autofocus />

      <button class="go-btn" id="proxy-go" title="Go"><svg class="svg-icon" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg></button>
    </div>
  </div>

  <!-- Ruffle Games Modal -->
  <div class="games-modal" id="games-modal">
    <div class="modal-header">
      <span>Ruffle Flash Games</span>
      <button class="nav-btn" id="games-close">×</button>
    </div>
    <div class="games-grid">
      <div class="game-card" data-game="https://example.com/game1.swf">Papa's Pizzeria</div>
      <div class="game-card" data-game="https://example.com/game2.swf">Henry Stickmin</div>
      <div class="game-card" data-game="https://example.com/game3.swf">Age of War</div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>Settings</span>
        <button class="nav-btn" id="modal-close">×</button>
      </div>
      <div class="setting-table">
        <div class="setting-row">
          <label for="gui-scale-slider">GUI Scale: <span id="gui-scale-val">1.0x</span></label>
          <input type="range" id="gui-scale-slider" min="0.8" max="1.5" step="0.05" value="1">
        </div>
        <div class="setting-row">
          <label for="preset-select">Educational Tab Disguise</label>
          <select id="preset-select" class="setting-select">
            <option value="canvas">Canvas LMS</option>
            <option value="none">default</option>
            <option value="classroom">Google Classroom</option>
            <option value="drive">Google Drive</option>
          </select>
        </div>
      </div>
      <button class="save-btn" id="save-settings">Save Configurations</button>
    </div>
  </div>

  <!-- Chat Drawer -->
  <div class="chat-drawer" id="chat-drawer">
    <div class="chat-header">
      <span>miksi Chat</span>
      <button class="nav-btn" id="chat-close">×</button>
    </div>
    <div id="chat-auth-view" class="chat-body" style="justify-content: center;">
      <div class="setting-row">
        <label>Display Name</label>
        <input type="text" id="username-input" class="setting-input" placeholder="Enter handle..." />
      </div>
      <button class="save-btn" id="sign-in-btn">Sign In to Chat</button>
    </div>
    <div id="chat-messages-view" class="chat-body hidden"><div id="chat-msg-list"></div></div>
    <div id="chat-footer-view" class="chat-footer hidden">
      <input type="text" id="chat-input" class="setting-input" style="flex:1;" placeholder="Message..." />
      <button class="save-btn" id="chat-send-btn">Send</button>
    </div>
  </div>

  <!-- Proxy Fullscreen Viewer -->
  <div class="proxy-viewer active" id="proxy-viewer">
    <div id="device-wrapper" class="device-viewport">
      <iframe id="proxy-iframe" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
