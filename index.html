<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser os</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, helvetica, arial, sans-serif;
      background-color: #030305;
      color: #e4e4e7;
    }

    /* GLSL-style fluid background animation */
    .fluid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      background: linear-gradient(125deg, #030305, #121218, #0a0a0f, #1a1a24);
      background-size: 400% 400%;
      animation: glslFluid 15s ease infinite;
    }
    @keyframes glslFluid {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .desktop-space {
      position: relative;
      width: 100vw;
      height: calc(100vh - 70px);
      z-index: 1;
      overflow: hidden;
    }

    /* Floating OS Window */
    .browser-window {
      position: absolute;
      top: 40px;
      left: 50px;
      width: 750px;
      height: 500px;
      background: rgba(18, 18, 22, 0.75);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      resize: both;
      overflow: hidden;
      min-width: 300px;
      min-height: 200px;
    }

    .window-header {
      height: 36px;
      background: rgba(25, 25, 32, 0.8);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 12px;
      cursor: grab;
      user-select: none;
    }
    .window-header:active {
      cursor: grabbing;
    }
    .window-title {
      font-size: 12px;
      color: #a1a1aa;
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .window-controls {
      display: flex;
      gap: 6px;
    }
    .win-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      cursor: pointer;
    }
    .dot-close { background: #ff5f56; }
    .dot-split { background: #ffbd2e; }

    .window-content {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    /* Bottom Dock / Nav Bar */
    .dock-container {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      z-index: 10;
      background: linear-gradient(135deg, rgba(30, 30, 38, 0.6), rgba(15, 15, 20, 0.8));
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .selector, .settings-btn {
      background: transparent;
      border: none;
      padding: 6px 10px;
      color: #d4d4d8;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .url-input {
      width: 380px;
      max-width: 50vw;
      background: transparent;
      border: none;
      padding: 6px 12px;
      color: #f4f4f5;
      font-size: 13px;
      outline: none;
    }
    .go-btn {
      background: #f4f4f5;
      color: #09090b;
      border: none;
      border-radius: 9999px;
      padding: 6px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 350px;
      background: rgba(20, 20, 26, 0.95);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 20px;
      z-index: 100;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
    }
    .modal h3 { margin-bottom: 12px; font-size: 16px; color: #fff; }
    .modal label { display: block; font-size: 12px; color: #a1a1aa; margin-top: 10px; }
    .modal select, .modal input[type="range"] { width: 100%; margin-top: 4px; padding: 6px; background: #2a2a35; border: 1px solid #3f3f46; color: #fff; border-radius: 6px; }
    .close-modal { margin-top: 16px; width: 100%; padding: 8px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <div class="fluid-bg"></div>

  <div class="desktop-space" id="desktopSpace">
    <!-- Default Starting Window -->
    <div class="browser-window" id="window-1" style="top: 20px; left: calc(50vw - 375px);">
      <div class="window-header" onmousedown="startDrag(event, 'window-1')" ondblclick="splitWindow('window-1')">
        <div class="window-controls">
          <div class="win-dot dot-close" onclick="closeWindow('window-1')"></div>
          <div class="win-dot dot-split" onclick="splitWindow('window-1')"></div>
        </div>
        <div class="window-title" id="title-1">about:blank</div>
      </div>
      <iframe class="window-content" id="frame-1" src="about:blank"></iframe>
    </div>
  </div>

  <div class="dock-container" id="dockContainer">
    <select id="modeSelector" class="selector">
      <option value="desktop">desktop mode</option>
      <option value="mobile">mobile mode</option>
      <option value="stealth">incognito</option>
    </select>
    <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);"></div>
    <input type="text" id="addressBar" class="url-input" placeholder="type url or search query..." autofocus>
    <div style="width:1px;height:14px;background:rgba(255,255,255,0.15);"></div>
    <button onclick="navigateActiveWindow()" class="go-btn">go</button>
    <button onclick="toggleSettings()" class="settings-btn">⚙️</button>
  </div>

  <!-- Settings Panel -->
  <div class="modal" id="settingsModal">
    <h3>browser settings</h3>
    <label>privacy mode / do not track</label>
    <select id="settingPrivacy">
      <option value="strict">strict (strip all trackers)</option>
      <option value="standard">standard</option>
    </select>
    <label>ui scaling</label>
    <input type="range" id="settingScale" min="80" max="120" value="100" oninput="updateUiScale(this.value)">
    <button class="close-modal" onclick="toggleSettings()">save & close</button>
  </div>

  <script>
    let windowCount = 1;
    let activeWindowId = 'window-1';

    const addressBar = document.getElementById('addressBar');
    const modeSelector = document.getElementById('modeSelector');

    addressBar.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') navigateActiveWindow();
    });

    function navigateActiveWindow() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const mode = modeSelector.value;
      const frame = document.getElementById(`frame-${activeWindowId.split('-')[1]}`);
      const title = document.getElementById(`title-${activeWindowId.split('-')[1]}`);

      if (frame) {
        frame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${mode}`;
        title.innerText = input;
      }
    }

    // Dragging Logic
    function startDrag(e, windowId) {
      activeWindowId = windowId;
      const win = document.getElementById(windowId);
      let shiftX = e.clientX - win.getBoundingClientRect().left;
      let shiftY = e.clientY - win.getBoundingClientRect().top;

      function moveAt(pageX, pageY) {
        win.style.left = pageX - shiftX + 'px';
        win.style.top = pageY - shiftY + 'px';
      }

      function onMouseMove(event) {
        moveAt(event.pageX, event.pageY);
      }

      document.addEventListener('mousemove', onMouseMove);

      document.onmouseup = function() {
        document.removeEventListener('mousemove', onMouseMove);
        document.onmouseup = null;
      };
    }

    function closeWindow(windowId) {
      const win = document.getElementById(windowId);
      if (win) win.remove();
    }

    function splitWindow(windowId) {
      windowCount++;
      const newId = `window-${windowCount}`;
      const desktop = document.getElementById('desktopSpace');

      const newWin = document.createElement('div');
      newWin.className = 'browser-window';
      newWin.id = newId;
      newWin.style.top = '60px';
      newWin.style.left = '100px';
      newWin.innerHTML = `
        <div class="window-header" onmousedown="startDrag(event, '${newId}')" ondblclick="splitWindow('${newId}')">
          <div class="window-controls">
            <div class="win-dot dot-close" onclick="closeWindow('${newId}')"></div>
            <div class="win-dot dot-split" onclick="splitWindow('${newId}')"></div>
          </div>
          <div class="window-title" id="title-${windowCount}">about:blank</div>
        </div>
        <iframe class="window-content" id="frame-${windowCount}" src="about:blank"></iframe>
      `;
      desktop.appendChild(newWin);
      activeWindowId = newId;
    }

    function toggleSettings() {
      const modal = document.getElementById('settingsModal');
      modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
    }

    function updateUiScale(val) {
      document.getElementById('dockContainer').style.transform = `translateX(-50%) scale(${val / 100})`;
    }
  </script>
</body>
</html>
