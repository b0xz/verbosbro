<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>browser</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, blinkmacsystemfont, "segoe ui", roboto, helvetica, arial, sans-serif;
      background-color: #0b0b0d;
      color: #e4e4e7;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    .viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #ffffff;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 8px 16px;
      background-color: rgba(18, 18, 20, 0.8);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }
    .selector {
      background: rgba(40, 40, 45, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 9999px;
      padding: 6px 14px;
      color: #a1a1aa;
      font-size: 12px;
      outline: none;
      cursor: pointer;
    }
    .url-input {
      width: 450px;
      max-width: 100%;
      background: linear-gradient(135deg, rgba(60, 60, 65, 0.4), rgba(35, 35, 40, 0.7));
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 7px 16px;
      color: #f4f4f5;
      font-size: 13px;
      outline: none;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.08), 0 4px 12px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }
    .url-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
      box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.15), 0 4px 16px rgba(0, 0, 0, 0.5);
    }
    .go-btn {
      background: rgba(244, 244, 245, 0.9);
      backdrop-filter: blur(8px);
      color: #09090b;
      border: none;
      border-radius: 9999px;
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .go-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <iframe id="browserFrame" class="viewport" src="about:blank"></iframe>
    <div class="nav-bar">
      <select id="modeSelector" class="selector">
        <option value="desktop">desktop</option>
        <option value="mobile">mobile</option>
        <option value="stealth">stealth</option>
      </select>
      <input type="text" id="addressBar" class="url-input" placeholder="type url or search..." autofocus>
      <button onclick="navigate()" class="go-btn">go</button>
    </div>
  </div>

  <script>
    const addressBar = document.getElementById('addressBar');
    const browserFrame = document.getElementById('browserFrame');
    const modeSelector = document.getElementById('modeSelector');

    addressBar.addEventListener('keypress', function(e) {
      if (e.key === 'enter') {
        navigate();
      }
    });

    function navigate() {
      let input = addressBar.value.trim();
      if (!input) return;

      if (!/^https?:\/\//i.test(input)) {
        if (input.includes('.') && !input.includes(' ')) {
          input = 'https://' + input;
        } else {
          input = 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(input);
        }
      }

      const selectedMode = modeSelector.value;
      browserFrame.src = `/api/proxy?url=${encodeURIComponent(input)}&mode=${selectedMode}`;
    }
  </script>

</body>
</html>
