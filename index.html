<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="tab-title">miksi</title>
  <link id="tab-favicon" rel="icon" type="image/x-icon" href="https://www.bing.com/th/id/OIP.cS6NYrx4o3zr-locEJ1AxwHaHa?w=205&h=205&c=8&rs=1&qlt=90&o=6&dpr=1.1&pid=3.1&rm=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&family=VT323&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #0a0a0a;
      --card-border: #1f1f1f;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --accent: #facc15;
      --accent-hover: #eab308;
      --pill-bg: #0d0d0d;
      --pill-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.8), 0 0 15px rgba(250, 204, 21, 0.05);
      --pill-border: #262626;
      --glow: rgba(250, 204, 21, 0.25);
      --font-pixel: 'Silkscreen', monospace;
      --font-readable: 'VT323', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-readable);
      letter-spacing: 0.5px;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    .miksi-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-image: url('https://www.bing.com/th/id/OIP.cS6NYrx4o3zr-locEJ1AxwHaHa?w=205&h=205&c=8&rs=1&qlt=90&o=6&dpr=1.1&pid=3.1&rm=2');
      background-size: 28px 28px;
      background-repeat: repeat;
      opacity: 0.05;
      z-index: 0;
      pointer-events: none;
      animation: moveMiksi 25s linear infinite;
      filter: invert(1);
    }

    @keyframes moveMiksi {
      0% { transform: translate(0, 0); }
      100% { transform: translate(-280px, 280px); }
    }

    .app-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .top-bar {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    .icon-btn {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
    }

    .svg-icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .svg-icon.hidden {
      display: none;
    }

    .brand {
      text-align: center;
      user-select: none;
    }

    .brand h1 {
      font-family: var(--font-pixel);
      font-size: 4rem;
      color: var(--text-main);
      letter-spacing: -1px;
      text-transform: lowercase;
      text-shadow: 0 0 20px rgba(250, 204, 21, 0.2);
    }

    .bottom-nav-wrapper {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 680px;
      z-index: 1001;
    }

    .bottom-nav-pill {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 50px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: var(--pill-shadow);
      transition: all 0.2s ease;
    }

    .bottom-nav-pill:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--glow), var(--pill-shadow);
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      flex-shrink: 0;
    }

    .nav-btn:hover {
      background: #1f1f1f;
      color: var(--accent);
    }

    .pill-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      padding: 8px 12px;
      font-size: 1.35rem;
      color: var(--text-main);
    }

    .pill-input::placeholder {
      color: var(--text-sub);
      font-size: 1.2rem;
    }

    .go-btn {
      background: var(--accent);
      border: none;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }

    .go-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.05);
    }

    .proxy-viewer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg-color);
      z-index: 999;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding-bottom: 90px;
    }

    .proxy-viewer.active {
      opacity: 1;
      pointer-events: all;
    }

    .proxy-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(6px);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      border-radius: 18px;
      width: 90%;
      max-width: 440px;
      padding: 24px;
      box-shadow: var(--pill-shadow);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-family: var(--font-pixel);
      font-size: 1.4rem;
    }

    .setting-table {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 16px;
      border-radius: 12px;
    }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .setting-row label {
      font-size: 1.1rem;
      color: var(--text-sub);
      display: flex;
      justify-content: space-between;
    }

    .setting-row label span {
      color: var(--accent);
      font-weight: bold;
    }

    .setting-select, .setting-input {
      background: #000;
      border: 1px solid var(--pill-border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 1.1rem;
      color: var(--text-main);
      outline: none;
    }

    .setting-select:focus, .setting-input:focus {
      border-color: var(--accent);
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .slider-container input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .save-btn {
      background: var(--accent);
      border: none;
      border-radius: 10px;
      padding: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #000;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .save-btn:hover {
      background: var(--accent-hover);
    }
  </style>
</head>
<body>

  <div class="miksi-bg"></div>

  <div class="app-container">
    <div class="top-bar">
      <button class="icon-btn" id="settings-btn" title="Settings & Strength">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </div>

    <div class="brand">
      <h1>miksi</h1>
    </div>
  </div>

  <div class="bottom-nav-wrapper">
    <div class="bottom-nav-pill">
      <button class="nav-btn" id="btn-back" title="Go Back">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>

      <button class="nav-btn" id="btn-forward" title="Go Forward">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>

      <button class="nav-btn" id="btn-reload" title="Refresh">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <path d="M23 4v6h-6"></path>
          <path d="M1 20v-6h6"></path>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>

      <input 
        type="text" 
        id="proxy-input" 
        class="pill-input" 
        placeholder="Search web or enter URL..." 
        autocomplete="off"
        autofocus
      />

      <button class="go-btn" id="proxy-go" title="Search / Go">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <button class="nav-btn hidden" id="btn-close-viewer" title="Close Viewer">
        <svg class="svg-icon" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
  </div>

  <div class="modal-overlay" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <h2>miksi settings</h2>
        <button class="nav-btn" id="modal-close">
          <svg class="svg-icon" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="setting-table">
        <div class="setting-row">
          <label for="strength-slider">Proxy Power Level: <span id="strength-val">3</span></label>
          <div class="slider-container">
            <input type="range" id="strength-slider" min="1" max="5" value="3">
          </div>
          <small style="color:var(--text-sub); font-size: 0.95rem;">1: Decent CORS | 3: HTML Rewriter | 5: Deep Media & Video Injection</small>
        </div>
      </div>

      <div class="setting-table">
        <div class="setting-row">
          <label for="preset-select">Educational Tab Disguise</label>
          <select id="preset-select" class="setting-select">
            <option value="none">default (miksi)</option>
            <option value="classroom">Google Classroom</option>
            <option value="drive">Google Drive</option>
            <option value="docs">Google Docs</option>
            <option value="canvas">Canvas LMS</option>
            <option value="edpuzzle">Edpuzzle</option>
            <option value="quizlet">Quizlet</option>
            <option value="clever">Clever</option>
            <option value="schoology">Schoology</option>
            <option value="khan">Khan Academy</option>
            <option value="desmos">Desmos Graphing Calculator</option>
          </select>
        </div>

        <div class="setting-row">
          <label for="custom-title-input">Custom Title</label>
          <input type="text" id="custom-title-input" class="setting-input" placeholder="e.g., Chemistry Homework" />
        </div>

        <div class="setting-row">
          <label for="custom-icon-input">Custom Favicon URL</label>
          <input type="text" id="custom-icon-input" class="setting-input" placeholder="https://example.com/favicon.ico" />
        </div>
      </div>

      <button class="save-btn" id="save-settings">Save Configurations</button>
    </div>
  </div>

  <div class="proxy-viewer" id="proxy-viewer">
    <iframe id="proxy-iframe" class="proxy-frame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"></iframe>
  </div>

  <script>
    /* ===================================================
       1. TAB DISGUISE MANAGEMENT
       =================================================== */
    const EDUCATIONAL_PRESETS = {
      none: { title: 'miksi', icon: 'https://www.bing.com/th/id/OIP.cS6NYrx4o3zr-locEJ1AxwHaHa?w=205&h=205&c=8&rs=1&qlt=90&o=6&dpr=1.1&pid=3.1&rm=2' },
      classroom: { title: 'Classes', icon: 'https://ssl.gstatic.com/classroom/favicon.png' },
      drive: { title: 'My Drive - Google Drive', icon: 'https://ssl.gstatic.com/images/branding/product/1x/drive_2020q4_32dp.png' },
      docs: { title: 'Google Docs', icon: 'https://ssl.gstatic.com/docs/documents/images/kix-favicon7.ico' },
      canvas: { title: 'Dashboard - Canvas', icon: 'https://du11hjcvx0uqb.cloudfront.net/dist/images/favicon-e10d657a73.ico' },
      edpuzzle: { title: 'Edpuzzle', icon: 'https://edpuzzle.imgix.net/edpuzzle-logo-icon.png?w=32' },
      quizlet: { title: 'Flashcards, learning tools, and textbook solutions | Quizlet', icon: 'https://assets.quizlet.com/a-s/j/favicon.ico' },
      clever: { title: 'Clever | Portal', icon: 'https://assets.clever.com/assets/favicon.ico' },
      schoology: { title: 'Home | Schoology', icon: 'https://www.schoology.com/sites/default/files/favicon.ico' },
      khan: { title: 'Dashboard | Khan Academy', icon: 'https://www.khanacademy.org/favicon.ico' },
      desmos: { title: 'Desmos | Graphing Calculator', icon: 'https://www.desmos.com/favicon.ico' }
    };

    const tabTitleEl = document.getElementById('tab-title');
    const tabFaviconEl = document.getElementById('tab-favicon');

    function applyTabDisguise(title, iconUrl) {
      tabTitleEl.textContent = title;
      tabFaviconEl.href = iconUrl;
    }

    function loadSavedDisguise() {
      const savedKey = localStorage.getItem('miksi_disguise_preset') || 'none';
      const customTitle = localStorage.getItem('miksi_custom_title');
      const customIcon = localStorage.getItem('miksi_custom_icon');

      if (savedKey === 'custom' && customTitle && customIcon) {
        applyTabDisguise(customTitle, customIcon);
      } else if (EDUCATIONAL_PRESETS[savedKey]) {
        const preset = EDUCATIONAL_PRESETS[savedKey];
        applyTabDisguise(preset.title, preset.icon);
      }
    }
    loadSavedDisguise();

    /* ===================================================
       2. SETTINGS MODAL INTERACTION
       =================================================== */
    const settingsBtn = document.getElementById('settings-btn');
    const settingsModal = document.getElementById('settings-modal');
    const modalCloseBtn = document.getElementById('modal-close');
    const strengthSlider = document.getElementById('strength-slider');
    const strengthVal = document.getElementById('strength-val');
    const presetSelect = document.getElementById('preset-select');
    const customTitleInput = document.getElementById('custom-title-input');
    const customIconInput = document.getElementById('custom-icon-input');
    const saveSettingsBtn = document.getElementById('save-settings');

    strengthSlider.addEventListener('input', (e) => {
      strengthVal.textContent = e.target.value;
    });

    settingsBtn.addEventListener('click', () => {
      const currentStrength = localStorage.getItem('miksi_strength') || '3';
      strengthSlider.value = currentStrength;
      strengthVal.textContent = currentStrength;
      presetSelect.value = localStorage.getItem('miksi_disguise_preset') || 'none';
      customTitleInput.value = localStorage.getItem('miksi_custom_title') || '';
      customIconInput.value = localStorage.getItem('miksi_custom_icon') || '';
      settingsModal.classList.add('active');
    });

    modalCloseBtn.addEventListener('click', () => settingsModal.classList.remove('active'));

    presetSelect.addEventListener('change', (e) => {
      const key = e.target.value;
      if (key !== 'none' && EDUCATIONAL_PRESETS[key]) {
        customTitleInput.value = EDUCATIONAL_PRESETS[key].title;
        customIconInput.value = EDUCATIONAL_PRESETS[key].icon;
      }
    });

    saveSettingsBtn.addEventListener('click', () => {
      localStorage.setItem('miksi_strength', strengthSlider.value);
      const selectedPreset = presetSelect.value;
      const titleVal = customTitleInput.value.trim();
      const iconVal = customIconInput.value.trim();

      if (selectedPreset !== 'none' && EDUCATIONAL_PRESETS[selectedPreset]) {
        const preset = EDUCATIONAL_PRESETS[selectedPreset];
        localStorage.setItem('miksi_disguise_preset', selectedPreset);
        applyTabDisguise(preset.title, preset.icon);
      } else if (titleVal && iconVal) {
        localStorage.setItem('miksi_disguise_preset', 'custom');
        localStorage.setItem('miksi_custom_title', titleVal);
        localStorage.setItem('miksi_custom_icon', iconVal);
        applyTabDisguise(titleVal, iconVal);
      } else {
        localStorage.setItem('miksi_disguise_preset', 'none');
        applyTabDisguise(EDUCATIONAL_PRESETS.none.title, EDUCATIONAL_PRESETS.none.icon);
      }
      settingsModal.classList.remove('active');
    });

    /* ===================================================
       3. PROXY CLIENT ROUTING
       =================================================== */
    const proxyInput = document.getElementById('proxy-input');
    const proxyGoBtn = document.getElementById('proxy-go');
    const proxyViewer = document.getElementById('proxy-viewer');
    const proxyIframe = document.getElementById('proxy-iframe');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnReload = document.getElementById('btn-reload');
    const btnCloseViewer = document.getElementById('btn-close-viewer');

    function processUrl(rawInput) {
      let query = rawInput.trim();
      if (!query) return '';
      const urlPattern = /^(https?:\/\/)?([\w\-]+(\.[\w\-]+)+)([\w\-\.,@?^=%&:/~\+#]*[\w\-\@?^=%&/~\+#])?\$/i;
      if (urlPattern.test(query)) {
        if (!query.startsWith('http://') && !query.startsWith('https://')) {
          return 'https://' + query;
        }
        return query;
      }
      return 'https://html.duckduckgo.com/html/?q=' + encodeURIComponent(query);
    }

    function buildProxyUrl(targetUrl) {
      const strength = localStorage.getItem('miksi_strength') || '3';
      return `/api/proxy?url=${encodeURIComponent(targetUrl)}&strength=${strength}`;
    }

    function launchProxy(rawInput) {
      const targetUrl = processUrl(rawInput);
      if (!targetUrl) return;
      proxyInput.value = targetUrl;
      proxyIframe.src = buildProxyUrl(targetUrl);
      proxyViewer.classList.add('active');
      btnCloseViewer.classList.remove('hidden');
    }

    proxyGoBtn.addEventListener('click', () => launchProxy(proxyInput.value));
    proxyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        launchProxy(proxyInput.value);
      }
    });

    btnBack.addEventListener('click', () => { try { proxyIframe.contentWindow.history.back(); } catch(e) {} });
    btnForward.addEventListener('click', () => { try { proxyIframe.contentWindow.history.forward(); } catch(e) {} });
    btnReload.addEventListener('click', () => { if (proxyIframe.src) proxyIframe.src = proxyIframe.src; });
    btnCloseViewer.addEventListener('click', () => {
      proxyViewer.classList.remove('active');
      btnCloseViewer.classList.add('hidden');
      proxyIframe.src = 'about:blank';
    });
  </script>
</body>
</html>
