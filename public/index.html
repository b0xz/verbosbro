<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tab-title">at26</title>
  <link id="tab-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text x='10' y='65' fill='%23fff' font-family='Share Tech Mono, monospace' font-size='35'>at26</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --gui-scale: 1;
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #222222;
      --text: #e2e8f0;
      --subtext: #888888;
      --accent: #ffffff;
      --hover: #1a1a1a;
      --font: 'Share Tech Mono', monospace;
      --border-radius: 8px;
      --panel-border: 1px solid var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); touch-action: manipulation; text-transform: lowercase; font-weight: 300; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg); color: var(--text); }

    #app-container {
      width: calc(100% / var(--gui-scale));
      height: calc(100% / var(--gui-scale));
      transform: scale(var(--gui-scale));
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Top Tab Bar */
    .top-browser-header {
      display: flex;
      align-items: center;
      height: 40px;
      background: var(--bg);
      border-bottom: var(--panel-border);
      padding: 0 10px;
      gap: 8px;
      z-index: 1100;
    }

    .tab-container {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
    }

    .tab-item {
      background: var(--panel);
      border: var(--panel-border);
      color: var(--subtext);
      padding: 6px 14px;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 180px;
      white-space: nowrap;
      user-select: none;
    }
    .tab-item.active { background: var(--bg); color: var(--text); border-bottom-color: var(--bg); font-weight: 600; }
    .tab-close { background: transparent; border: none; color: var(--subtext); cursor: pointer; font-size: 0.9rem; }
    .tab-close:hover { color: var(--text); }
    
    .add-tab-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .add-tab-btn:hover { background: var(--hover); }

    /* Browser Navigation & Toolbar */
    .browser-toolbar {
      display: flex;
      align-items: center;
      height: 48px;
      background: var(--panel);
      border-bottom: var(--panel-border);
      padding: 0 12px;
      gap: 8px;
      z-index: 1050;
    }

    .toolbar-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toolbar-btn:hover { background: var(--hover); color: var(--accent); }

    .url-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: var(--panel-border);
      border-radius: 20px;
      padding: 0 14px;
      height: 34px;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.9rem;
      color: var(--text);
    }
    .url-input::placeholder { color: var(--subtext); }

    /* Workspace Area */
    .workspace-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .view-page {
      position: absolute;
      inset: 0;
      bottom: 0;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }
    .view-page.active { display: flex; }

    /* Home View with at26 Logo */
    #home-view {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding-bottom: 56px;
    }
    .brand-container {
      font-size: 4rem;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--text);
    }

    /* Bottom Navigation Dock */
    .sidebar-dock {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 16px;
      background: var(--panel);
      border-top: var(--panel-border);
      z-index: 1200;
    }
    .dock-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 8px 16px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .dock-btn:hover, .dock-btn.active { background: var(--hover); color: var(--text); }

    /* Proxy Viewer Frame */
    .proxy-viewer {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
    }
    .proxy-viewer.active { display: block; }

    /* Chat Layout Styles */
    .chat-layout { display: flex; flex: 1; width: 100%; height: 100%; background: var(--bg); padding-bottom: 56px; }
    .chat-sidebar { width: 240px; background: var(--panel); border-right: var(--panel-border); display: flex; flex-direction: column; padding: 20px; gap: 8px; overflow-y: auto; }
    .chat-sidebar h4 { font-size: 0.85rem; color: var(--subtext); margin-top: 5px; margin-bottom: 2px; }
    .room-btn { background: var(--bg); border: var(--panel-border); color: var(--text); padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; text-align: left; font-size: 0.88rem; }
    .room-btn.active, .room-btn:hover { border-color: var(--accent); background: var(--hover); }
    .chat-main-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 14px; background: var(--bg); }
    .chat-messages-container { flex: 1; background: var(--panel); border: var(--panel-border); border-radius: var(--border-radius); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg-item { display: flex; gap: 14px; align-items: flex-start; }
    .chat-msg-pfp { width: 40px; height: 40px; border-radius: 50%; border: var(--panel-border); background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .chat-msg-pfp img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .chat-msg-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .chat-msg-header { display: flex; gap: 10px; align-items: baseline; }
    .chat-msg-username { font-weight: bold; font-size: 0.95rem; }
    .chat-msg-time { font-size: 0.75rem; color: var(--subtext); }
    .chat-msg-text { font-size: 0.98rem; color: var(--text); word-break: break-word; }
    .chat-input-bar { display: flex; gap: 10px; align-items: center; background: var(--panel); border: var(--panel-border); border-radius: 35px; padding: 8px 18px; }

    /* Fixed Games Viewport Container */
    #games-page-view {
      display: none;
      flex-direction: column;
      padding-bottom: 56px;
      height: 100%;
    }
    #games-page-view.active {
      display: flex;
    }
    .games-iframe-wrapper {
      flex: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      padding: 10px;
    }

    /* Fullscreen Tabbed Settings */
    .settings-container {
      padding: 30px;
      overflow-y: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      background: var(--bg);
      padding-bottom: 80px;
    }
    .settings-tabs-header {
      display: flex;
      gap: 10px;
      border-bottom: var(--panel-border);
      padding-bottom: 12px;
      flex-wrap: wrap;
    }
    .settings-tab-btn {
      background: var(--panel);
      border: var(--panel-border);
      color: var(--subtext);
      padding: 8px 16px;
      border-radius: var(--border-radius);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .settings-tab-btn.active {
      background: var(--bg);
      color: var(--text);
      border-color: var(--accent);
    }
    .settings-tab-pane {
      display: none;
      flex-direction: column;
      gap: 16px;
    }
    .settings-tab-pane.active {
      display: flex;
    }

    .setting-card {
      background: var(--panel);
      border: var(--panel-border);
      border-radius: var(--border-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 650px;
    }
    .setting-card label { font-size: 0.85rem; color: var(--subtext); }
    .setting-input { background: var(--bg); border: var(--panel-border); border-radius: 8px; padding: 10px; color: var(--text); outline: none; width: 100%; }

    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-card { background: var(--bg); border: var(--panel-border); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .theme-card:hover, .theme-card.active { border-color: var(--accent); background: var(--hover); }
    .theme-color-preview { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); }

    .action-btn { background: var(--text); border: none; border-radius: 8px; padding: 10px 16px; font-weight: bold; color: var(--bg); cursor: pointer; }
    .action-btn:hover { opacity: 0.9; }

    .svg-icon { width: 18px; height: 18px; fill: currentColor; }

    /* Modals for History & Bookmarks */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: var(--panel); border: var(--panel-border); border-radius: var(--border-radius); width: 90%; max-width: 500px; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: var(--panel-border); padding-bottom: 10px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg); border: var(--panel-border); border-radius: 6px; font-size: 0.88rem; cursor: pointer; }
    .list-item:hover { background: var(--hover); }
  </style>
</head>
<body>

<div id="app-container">

  <!-- Top Browser Header (Tabs) -->
  <div class="top-browser-header">
    <div class="tab-container" id="tab-bar">
      <button class="add-tab-btn" id="add-tab-btn" title="new tab">+</button>
    </div>
  </div>

  <!-- Browser Navigation Toolbar -->
  <div class="browser-toolbar">
    <button class="toolbar-btn" id="btn-back" title="back"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <button class="toolbar-btn" id="btn-forward" title="forward"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
    <button class="toolbar-btn" id="btn-reload" title="reload"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    <button class="toolbar-btn" id="btn-home" title="home"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>

    <div class="url-bar-container">
      <input type="text" class="url-input" id="proxy-input" placeholder="search or enter address..." autocomplete="off">
      <button class="toolbar-btn" id="btn-star" title="star this page"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg></button>
    </div>

    <button class="toolbar-btn" id="btn-fullscreen" title="fullscreen"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg></button>
    <button class="toolbar-btn" id="btn-history" title="history"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 1 1 7 7 7 7 0 0 1-4.93-2.08l-1.42 1.42A9 9 0 1 0 13 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg></button>
    <button class="toolbar-btn" id="btn-bookmarks" title="bookmarks"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg></button>
  </div>

  <!-- Workspace Area -->
  <div class="workspace-area">

    <!-- Home View with at26 Logo -->
    <div class="view-page active" id="home-view">
      <div class="brand-container">at26</div>
      <div id="live-time-display" style="font-size: 0.9rem; color: var(--subtext);">00:00:00</div>
    </div>

    <!-- Proxy Viewer -->
    <iframe class="view-page proxy-viewer" id="proxy-viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock"></iframe>

    <!-- Chat View -->
    <div class="view-page" id="chat-page-view">
      <div class="chat-layout">
        <div class="chat-sidebar">
          <h4>servers</h4>
          <button class="room-btn active" data-room="global"># global-chat</button>
          <button class="room-btn" data-room="general-1"># general-1</button>
          <button class="room-btn" data-room="general-2"># general-2</button>
        </div>
        <div class="chat-main-area">
          <div style="font-weight: bold; font-size: 1.15rem;"><span id="current-room-title"># global-chat</span></div>
          <div class="chat-messages-container" id="chat-messages"></div>
          <div class="chat-input-bar">
            <input type="text" id="chat-input" class="url-input" placeholder="type a message..." autocomplete="off" />
            <button class="toolbar-btn" id="chat-send" title="send"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Games Hub with fixed iframe layout -->
    <div class="view-page" id="games-page-view">
      <div class="games-iframe-wrapper">
        <h2 style="margin-bottom:6px; font-size:1rem;">gn-math games</h2>
        <iframe src="https://s3.amazonaws.com/prageru-server/mathematics.html" style="width:100%; flex:1; border:var(--panel-border); border-radius:var(--border-radius); background:#fff;"></iframe>
      </div>
    </div>

    <!-- Fullscreen Settings View with Tabs -->
    <div class="view-page" id="settings-page-view">
      <div class="settings-container">
        <h2>at26 settings & preferences</h2>

        <div class="settings-tabs-header">
          <button class="settings-tab-btn active" data-tab="ui">ui</button>
          <button class="settings-tab-btn" data-tab="advanced">advanced</button>
          <button class="settings-tab-btn" data-tab="privacy">privacy / cloaking / security</button>
          <button class="settings-tab-btn" data-tab="profile">profile</button>
          <button class="settings-tab-btn" data-tab="misc">misc & data</button>
        </div>

        <!-- UI Tab -->
        <div class="settings-tab-pane active" id="pane-ui">
          <div class="setting-card">
            <label>color scheme</label>
            <div class="theme-grid">
              <div class="theme-card active" data-theme="oled"><div class="theme-color-preview" style="background:#000000;"></div><span>oled black</span></div>
              <div class="theme-card" data-theme="charcoal"><div class="theme-color-preview" style="background:#121212;"></div><span>charcoal</span></div>
              <div class="theme-card" data-theme="matrix"><div class="theme-color-preview" style="background:#022c14;"></div><span>matrix green</span></div>
              <div class="theme-card" data-theme="blossom"><div class="theme-color-preview" style="background:#2d121c;"></div><span>blossom pink</span></div>
              <div class="theme-card" data-theme="crimson"><div class="theme-color-preview" style="background:#2a080c;"></div><span>crimson red</span></div>
              <div class="theme-card" data-theme="aquatic"><div class="theme-color-preview" style="background:#061a24;"></div><span>aquatic cyan</span></div>
            </div>
          </div>
          <div class="setting-card">
            <label>gui scale size (<span id="gui-scale-val">1.0</span>x)</label>
            <input type="range" id="gui-scale-slider" class="setting-input" min="0.8" max="1.5" step="0.05" value="1.0" style="padding:0; cursor:pointer;">
          </div>
        </div>

        <!-- Advanced Tab -->
        <div class="settings-tab-pane" id="pane-advanced">
          <div class="setting-card">
            <label>interface style options</label>
            <select id="style-option-select" class="setting-input">
              <option value="minimalist">minimalist dark</option>
              <option value="compact">compact toolbar</option>
              <option value="modern">modern glass</option>
            </select>
          </div>
        </div>

        <!-- Privacy / Cloaking / Security Tab -->
        <div class="settings-tab-pane" id="pane-privacy">
          <div class="setting-card">
            <label>tab & favicon cloak presets</label>
            <select id="tab-cloak-preset" class="setting-input">
              <option value="at26">at26 (default)</option>
              <option value="google">google search</option>
              <option value="khan">khan academy</option>
              <option value="drive">google drive</option>
            </select>
          </div>
          <div class="setting-card">
            <label>manual stealth cloak (or press '\')</label>
            <button class="action-btn" id="manual-cloak-btn" style="background:#ef4444; color:#fff;">cloak view now</button>
          </div>
        </div>

        <!-- Profile Tab -->
        <div class="settings-tab-pane" id="pane-profile">
          <div class="setting-card">
            <label>account display name</label>
            <input type="text" id="profile-name" class="setting-input" placeholder="your username...">
          </div>
          <div class="setting-card">
            <label>bio / status</label>
            <textarea id="profile-bio" class="setting-input" rows="2" placeholder="tell others about yourself..."></textarea>
          </div>
          <div class="setting-card">
            <label>profile picture URL or emoji</label>
            <input type="text" id="profile-pfp" class="setting-input" placeholder="https:// or emoji...">
          </div>
          <div class="setting-card">
            <label>username color</label>
            <input type="color" id="profile-color" class="setting-input" value="#ffffff" style="height:40px; padding:2px; cursor:pointer;">
          </div>
          <div class="setting-card">
            <label>username animation effect</label>
            <select id="profile-anim" class="setting-input">
              <option value="none">none</option>
              <option value="wavy">wavy animation</option>
            </select>
          </div>
          <button class="action-btn" id="save-profile">save profile settings</button>
        </div>

        <!-- Misc & Data Tab -->
        <div class="settings-tab-pane" id="pane-misc">
          <div class="setting-card">
            <label>export local data (json backup)</label>
            <button class="action-btn" id="export-json-btn">export data to json</button>
          </div>
          <div class="setting-card">
            <label>import local data (json restore)</label>
            <input type="file" id="import-json-file" accept=".json" class="setting-input" style="padding:6px;">
          </div>
          <div class="setting-card" style="border-color: #ef4444;">
            <label style="color:#ef4444;">danger zone</label>
            <button class="action-btn" id="clear-local-data" style="background:#ef4444; color:#fff;">delete all local data</button>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Bottom Navigation Dock -->
  <div class="sidebar-dock">
    <button class="dock-btn active" id="dock-home" title="home"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>home</button>
    <button class="dock-btn" id="dock-chat" title="chat"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>chat</button>
    <button class="dock-btn" id="dock-games" title="games"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-3c-.83 0-1.5-.67-1.5-1.5S17.67 9 18.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>games</button>
