<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="tab-title">styu v1.0</title>
  <link id="tab-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><circle cx='50' cy='50' r='30' fill='%23fff'/></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Press+Start+2P&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --gui-scale: 1;
      --bg: #000000;
      --panel: #0a0a0a;
      --border: #222222;
      --text: #e2e8f0;
      --subtext: #888888;
      --accent: #ffffff;
      --hover: #1a1a1a;
      --font: 'Inter', Arial, sans-serif;
      --border-radius: 8px;
      --panel-border: 1px solid var(--border);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); touch-action: manipulation; }
    body, html { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg); color: var(--text); }

    /* Clean Scaled UI Wrapper */
    #app-container {
      width: calc(100% / var(--gui-scale));
      height: calc(100% / var(--gui-scale));
      transform: scale(var(--gui-scale));
      transform-origin: top left;
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
    }

    .hidden { display: none !important; }

    /* Top Tab Bar */
    .top-browser-header {
      display: flex;
      align-items: center;
      height: 40px;
      background: var(--bg);
      border-bottom: var(--panel-border);
      padding: 0 10px;
      gap: 8px;
      z-index: 1100;
    }

    .tab-container {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      flex: 1;
    }

    .tab-item {
      background: var(--panel);
      border: var(--panel-border);
      color: var(--subtext);
      padding: 6px 14px;
      border-radius: var(--border-radius) var(--border-radius) 0 0;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 180px;
      white-space: nowrap;
      user-select: none;
    }
    .tab-item.active { background: var(--bg); color: var(--text); border-bottom-color: var(--bg); font-weight: 600; }
    .tab-close { background: transparent; border: none; color: var(--subtext); cursor: pointer; font-size: 0.9rem; }
    .tab-close:hover { color: var(--text); }
    
    .add-tab-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }
    .add-tab-btn:hover { background: var(--hover); }

    /* Browser Navigation & Toolbar */
    .browser-toolbar {
      display: flex;
      align-items: center;
      height: 48px;
      background: var(--panel);
      border-bottom: var(--panel-border);
      padding: 0 12px;
      gap: 8px;
      z-index: 1050;
    }

    .toolbar-btn {
      background: transparent;
      border: none;
      color: var(--text);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .toolbar-btn:hover { background: var(--hover); color: var(--accent); }

    .url-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: var(--bg);
      border: var(--panel-border);
      border-radius: 20px;
      padding: 0 14px;
      height: 34px;
      gap: 8px;
    }

    .url-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 0.9rem;
      color: var(--text);
    }
    .url-input::placeholder { color: var(--subtext); }

    /* Workspace Content Area */
    .workspace-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
    }

    .view-page {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: var(--bg);
    }
    .view-page.active { display: flex; }

    /* Home View */
    #home-view {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 8px;
    }
    .styu-brand {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--text);
    }
    .online-counter {
      font-size: 0.85rem;
      color: var(--subtext);
    }

    /* Sidebar Dock (Left Mini Nav) */
    .sidebar-dock {
      position: fixed;
      left: 0;
      top: 90px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border-top: var(--panel-border);
      border-right: var(--panel-border);
      border-bottom: var(--panel-border);
      border-radius: 0 12px 12px 0;
      z-index: 1200;
    }
    .dock-btn {
      background: transparent;
      border: none;
      color: var(--subtext);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dock-btn:hover, .dock-btn.active { background: var(--hover); color: var(--text); }

    /* Proxy Viewer Frame */
    .proxy-viewer {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
      display: none;
    }
    .proxy-viewer.active { display: block; }

    /* Chat Layout Styles */
    .chat-layout { display: flex; flex: 1; width: 100%; height: 100%; background: var(--bg); }
    .chat-sidebar { width: 240px; background: var(--panel); border-right: var(--panel-border); display: flex; flex-direction: column; padding: 20px; gap: 8px; overflow-y: auto; }
    .chat-sidebar h4 { font-size: 0.85rem; color: var(--subtext); margin-top: 5px; margin-bottom: 2px; }
    .room-btn { background: var(--bg); border: var(--panel-border); color: var(--text); padding: 8px 12px; border-radius: var(--border-radius); cursor: pointer; text-align: left; font-size: 0.88rem; }
    .room-btn.active, .room-btn:hover { border-color: var(--accent); background: var(--hover); }
    .chat-main-area { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 14px; background: var(--bg); }
    .chat-messages-container { flex: 1; background: var(--panel); border: var(--panel-border); border-radius: var(--border-radius); padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .chat-msg-item { display: flex; gap: 14px; align-items: flex-start; }
    .chat-msg-pfp { width: 40px; height: 40px; border-radius: 50%; border: var(--panel-border); background: var(--bg); overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
    .chat-msg-pfp img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .chat-msg-content { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .chat-msg-header { display: flex; gap: 10px; align-items: baseline; }
    .chat-msg-username { font-weight: bold; font-size: 0.95rem; }
    .chat-msg-time { font-size: 0.75rem; color: var(--subtext); }
    .chat-msg-text { font-size: 0.98rem; color: var(--text); word-break: break-word; }
    .chat-input-bar { display: flex; gap: 10px; align-items: center; background: var(--panel); border: var(--panel-border); border-radius: 35px; padding: 8px 18px; }

    /* Settings & General Page Containers */
    .page-container {
      padding: 30px;
      overflow-y: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .setting-group { display: flex; flex-direction: column; gap: 8px; max-width: 450px; }
    .setting-group label { font-size: 0.85rem; color: var(--subtext); }
    .setting-input { background: var(--panel); border: var(--panel-border); border-radius: 8px; padding: 10px; color: var(--text); outline: none; width: 100%; }

    .theme-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .theme-card { background: var(--panel); border: var(--panel-border); border-radius: 8px; padding: 10px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.85rem; }
    .theme-card:hover, .theme-card.active { border-color: var(--accent); background: var(--hover); }
    .theme-color-preview { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--border); }

    .action-btn { background: var(--text); border: none; border-radius: 8px; padding: 10px 16px; font-weight: bold; color: var(--bg); cursor: pointer; }
    .action-btn:hover { opacity: 0.9; }

    .svg-icon { width: 18px; height: 18px; fill: currentColor; }

    /* Modals for History & Bookmarks */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: center; justify-content: center; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: var(--panel); border: var(--panel-border); border-radius: var(--border-radius); width: 90%; max-width: 500px; padding: 24px; display: flex; flex-direction: column; gap: 16px; max-height: 80vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; border-bottom: var(--panel-border); padding-bottom: 10px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg); border: var(--panel-border); border-radius: 6px; font-size: 0.88rem; cursor: pointer; }
    .list-item:hover { background: var(--hover); }
  </style>
</head>
<body>

<div id="app-container">

  <!-- Sidebar Dock -->
  <div class="sidebar-dock">
    <button class="dock-btn active" id="dock-home" title="Home">🏠</button>
    <button class="dock-btn" id="dock-chat" title="Chat">💬</button>
    <button class="dock-btn" id="dock-games" title="gn-math games">🎮</button>
    <button class="dock-btn" id="dock-settings" title="Settings">⚙️</button>
  </div>

  <!-- Top Browser Header (Tabs) -->
  <div class="top-browser-header">
    <div class="tab-container" id="tab-bar">
      <button class="add-tab-btn" id="add-tab-btn" title="New Tab">+</button>
    </div>
  </div>

  <!-- Browser Navigation Toolbar with Fixed SVGs -->
  <div class="browser-toolbar">
    <button class="toolbar-btn" id="btn-back" title="Back"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <button class="toolbar-btn" id="btn-forward" title="Forward"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg></button>
    <button class="toolbar-btn" id="btn-reload" title="Reload"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg></button>
    <button class="toolbar-btn" id="btn-home" title="Home"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></button>

    <div class="url-bar-container">
      <input type="text" class="url-input" id="proxy-input" placeholder="Search or enter address..." autocomplete="off">
      <button class="toolbar-btn" id="btn-star" title="Star this page">⭐</button>
    </div>

    <button class="toolbar-btn" id="btn-fullscreen" title="Fullscreen">🖵</button>
    <button class="toolbar-btn" id="btn-history" title="History">🕒</button>
    <button class="toolbar-btn" id="btn-bookmarks" title="Bookmarks">📌</button>
  </div>

  <!-- Workspace Area -->
  <div class="workspace-area">

    <!-- Home View -->
    <div class="view-page active" id="home-view">
      <h1 class="styu-brand">styu</h1>
      <div class="online-counter" id="online-counter-text">1 person online</div>
    </div>

    <!-- Proxy Viewer -->
    <iframe class="view-page proxy-viewer" id="proxy-viewer" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-pointer-lock"></iframe>

    <!-- Chat View -->
    <div class="view-page" id="chat-page-view">
      <div class="chat-layout">
        <div class="chat-sidebar">
          <h4>servers</h4>
          <button class="room-btn active" data-room="global"># global-chat</button>
          <button class="room-btn" data-room="general-1"># general-1</button>
          <button class="room-btn" data-room="general-2"># general-2</button>
        </div>
        <div class="chat-main-area">
          <div style="font-weight: bold; font-size: 1.15rem;"><span id="current-room-title"># global-chat</span></div>
          <div class="chat-messages-container" id="chat-messages"></div>
          <div class="chat-input-bar">
            <input type="text" id="chat-input" class="url-input" placeholder="type a message..." autocomplete="off" />
            <button class="toolbar-btn" id="chat-send" title="send"><svg class="svg-icon" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
          </div>
        </div>
      </div>
    </div>

    <!-- Games Hub (gn-math games) -->
    <div class="view-page" id="games-page-view">
      <div class="page-container" style="padding:10px;">
        <h2 style="margin-bottom:10px;">gn-math games</h2>
        <iframe src="https://s3.amazonaws.com/prageru-server/mathematics.html" style="width:100%; flex:1; border:var(--panel-border); border-radius:var(--border-radius); background:#fff;"></iframe>
      </div>
    </div>

    <!-- Settings View -->
    <div class="view-page" id="settings-page-view">
      <div class="page-container">
        <h2>styu settings & preferences</h2>

        <div class="setting-group">
          <label>Theme Palette</label>
          <div class="theme-grid">
            <div class="theme-card active" data-theme="oled"><div class="theme-color-preview" style="background:#000000;"></div><span>OLED Black</span></div>
            <div class="theme-card" data-theme="charcoal"><div class="theme-color-preview" style="background:#121212;"></div><span>Charcoal</span></div>
            <div class="theme-card" data-theme="matrix"><div class="theme-color-preview" style="background:#022c14;"></div><span>Matrix Green</span></div>
            <div class="theme-card" data-theme="blossom"><div class="theme-color-preview" style="background:#2d121c;"></div><span>Blossom Pink</span></div>
            <div class="theme-card" data-theme="crimson"><div class="theme-color-preview" style="background:#2a080c;"></div><span>Crimson Red</span></div>
            <div class="theme-card" data-theme="aquatic"><div class="theme-color-preview" style="background:#061a24;"></div><span>Aquatic Cyan</span></div>
          </div>
        </div>

        <div class="setting-group">
          <label>Interface Style Options</label>
          <select id="style-option-select" class="setting-input">
            <option value="minimalist">Minimalist Dark</option>
            <option value="compact">Compact Toolbar</option>
            <option value="modern">Modern Glass</option>
          </select>
        </div>

        <div class="setting-group">
          <label>GUI Scale Size (<span id="gui-scale-val">1.0</span>x)</label>
          <input type="range" id="gui-scale-slider" class="setting-input" min="0.8" max="1.5" step="0.05" value="1.0" style="padding:0; cursor:pointer;">
        </div>

        <div class="setting-group">
          <label>Tab Cloak Preset</label>
          <select id="tab-cloak-preset" class="setting-input">
            <option value="styu">styu v1.0 (default)</option>
            <option value="google">Google Search</option>
            <option value="khan">Khan Academy</option>
            <option value="drive">Google Drive</option>
          </select>
        </div>
      </div>
    </div>

  </div>

</div>

<!-- History Modal -->
<div class="modal-overlay hidden" id="history-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>Browsing History</span>
      <button class="toolbar-btn" id="close-history">✕</button>
    </div>
    <div id="history-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    <button class="action-btn" id="clear-history">Clear History</button>
  </div>
</div>

<!-- Bookmarks Modal -->
<div class="modal-overlay hidden" id="bookmarks-modal">
  <div class="modal-box">
    <div class="modal-header">
      <span>Starred Bookmarks</span>
      <button class="toolbar-btn" id="close-bookmarks">✕</button>
    </div>
    <div id="bookmarks-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<script src="/script.js"></script>
<script src="/chat.js"></script>
</body>
</html>
